<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAUX Party Room · Request Songs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { background-color: #080808; color: #f5f5f5; font-family: 'Inter', sans-serif; }
    .font-anton { font-family: 'Anton', sans-serif; letter-spacing: 0.05em; }
    .text-lime { color: #d4ff00; }
    .bg-lime { background-color: #d4ff00; }
    .border-lime { border-color: #d4ff00; }
  </style>
</head>
<body class="min-h-screen p-4 max-w-md mx-auto flex flex-col justify-between selection:bg-lime selection:text-black">

  <!-- Header -->
  <header class="flex justify-between items-center py-4 border-b border-white/10">
    <div class="flex items-center gap-2">
      <h1 class="text-2xl font-anton text-lime tracking-wider">NAUX</h1>
      <span class="text-[10px] uppercase tracking-widest text-white/40 border border-white/20 px-2 py-0.5 rounded">Guest Mode</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs text-white/50">Room:</span>
      <span id="roomCodeBadge" class="bg-white/10 text-lime font-mono font-bold text-xs px-2.5 py-1 rounded-lg border border-lime/30">AUX1</span>
    </div>
  </header>

  <main class="space-y-6 flex-1 py-4">

    <!-- Currently Playing on Aux Banner -->
    <div class="bg-white/5 border border-white/10 rounded-2xl p-4 relative overflow-hidden">
      <div class="flex items-center gap-2 mb-2">
        <span class="w-2 h-2 rounded-full bg-lime animate-ping"></span>
        <span class="text-[10px] font-bold uppercase tracking-wider text-lime">Live on the Aux</span>
      </div>
      <h2 id="nowPlayingTitle" class="text-xl font-anton text-white uppercase truncate">
        Tauba Tauba
      </h2>
      <p id="nowPlayingArtist" class="text-xs text-white/60 truncate">
        Karan Aujla
      </p>
    </div>

    <!-- Search Songs to Request -->
    <div class="space-y-3">
      <div class="flex justify-between items-center">
        <label class="text-xs uppercase font-bold text-white/50 tracking-wider">Request A Track</label>
        <span class="text-[10px] text-white/30">1,200+ Songs</span>
      </div>
      <div class="relative">
        <input id="searchInput" type="text" placeholder="Search Hindi, Punjabi, Bollywood..." 
               class="w-full bg-black/60 border border-white/20 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-lime text-white pr-10">
        <span class="absolute right-3 top-3 text-white/40 text-sm">🔍</span>
      </div>
    </div>

    <!-- Search Results / Catalog List -->
    <div class="space-y-2">
      <div id="resultsList" class="space-y-2 max-h-72 overflow-y-auto divide-y divide-white/5 pr-1">
        <!-- Dynamically populated -->
        <p class="text-xs text-white/40 text-center py-4">Type a song or artist name to request...</p>
      </div>
    </div>

    <!-- Current Room Requests / Crowd Votes -->
    <div class="bg-white/5 border border-white/10 rounded-2xl p-4 space-y-3">
      <h3 class="text-xs uppercase font-bold text-white/70 tracking-wider flex justify-between items-center">
        <span>Party Requests</span>
        <span id="reqCount" class="text-lime text-[10px]">0 queued</span>
      </h3>
      <div id="roomRequestsList" class="space-y-2 max-h-48 overflow-y-auto divide-y divide-white/5">
        <p class="text-xs text-white/30 text-center py-3">No requests yet. Be the first to add one!</p>
      </div>
    </div>

  </main>

  <!-- Guest Name Modal / Prompt -->
  <footer class="text-center text-[10px] text-white/30 py-3 border-t border-white/10">
    NAUX Party Room · Requests play automatically when previous track ends.
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomCode = (urlParams.get('code') || 'AUX1').toUpperCase();
    document.getElementById('roomCodeBadge').textContent = roomCode;

    let guestName = localStorage.getItem('naux_guest_name') || 'Guest ' + Math.floor(Math.random() * 900 + 100);

    // 1. Fetch Room State (Now Playing & Requests)
    async function updateRoomState() {
      try {
        const res = await fetch(`/api/room?code=${roomCode}`);
        const data = await res.json();
        
        if (data.now_playing) {
          document.getElementById('nowPlayingTitle').textContent = data.now_playing.title || 'Party Mix';
          document.getElementById('nowPlayingArtist').textContent = data.now_playing.artist || '';
        }

        renderRequests(data.requests || []);
      } catch(e) {}
    }

    function renderRequests(reqs) {
      const el = document.getElementById('roomRequestsList');
      document.getElementById('reqCount').textContent = `${reqs.length} queued`;

      if (reqs.length === 0) {
        el.innerHTML = '<p class="text-xs text-white/30 text-center py-3">No requests yet. Be the first to add one!</p>';
        return;
      }

      el.innerHTML = '';
      reqs.forEach((r, idx) => {
        const div = document.createElement('div');
        div.className = 'pt-2 flex justify-between items-center text-xs';
        div.innerHTML = `
          <div class="truncate pr-2">
            <p class="font-bold text-white truncate">${idx + 1}. ${r.song.title}</p>
            <p class="text-[10px] text-white/40 truncate">${r.song.artist} · <span class="text-white/60">by ${r.guest}</span></p>
          </div>
          <span class="text-xs text-lime font-mono">Hook @ ${r.song.entry_sec}s</span>
        `;
        el.appendChild(div);
      });
    }

    // 2. Search Songs
    let debounceTimer = null;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      const query = e.target.value.trim();
      if (!query) {
        document.getElementById('resultsList').innerHTML = '<p class="text-xs text-white/40 text-center py-4">Type a song or artist name to request...</p>';
        return;
      }

      debounceTimer = setTimeout(async () => {
        try {
          const res = await fetch(`/api/songs?q=${encodeURIComponent(query)}`);
          const songs = await res.json();
          renderSearchResults(songs);
        } catch(e) {}
      }, 300);
    });

    function renderSearchResults(songs) {
      const listEl = document.getElementById('resultsList');
      listEl.innerHTML = '';

      if (songs.length === 0) {
        listEl.innerHTML = '<p class="text-xs text-white/40 text-center py-4">No matching songs found.</p>';
        return;
      }

      songs.slice(0, 15).forEach(s => {
        const item = document.createElement('div');
        item.className = 'pt-2 pb-2 flex justify-between items-center text-xs';
        item.innerHTML = `
          <div class="truncate pr-2">
            <p class="font-bold text-white truncate">${s.title}</p>
            <p class="text-[10px] text-white/50 truncate">${s.artist}</p>
          </div>
          <button class="req-btn bg-lime text-black font-anton px-3 py-1.5 rounded-lg text-xs uppercase hover:brightness-110 active:scale-95 transition"
                  data-id="${s.song_id}" data-title="${s.title}">
            Request 🙋‍♂️
          </button>
        `;
        listEl.appendChild(item);
      });

      document.querySelectorAll('.req-btn').forEach(b => {
        b.addEventListener('click', async () => {
          const songId = b.dataset.id;
          const songTitle = b.dataset.title;
          b.disabled = true;
          b.textContent = 'Sent! ✓';
          b.className = 'bg-white/20 text-white/50 font-anton px-3 py-1.5 rounded-lg text-xs uppercase';

          await fetch('/api/request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              room_code: roomCode,
              song_id: songId,
              guest_name: guestName
            })
          });

          updateRoomState();
        });
      });
    }

    // Initial fetch & poll every 3 seconds
    updateRoomState();
    setInterval(updateRoomState, 3000);
  </script>
</body>
</html>
